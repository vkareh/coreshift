name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

  nightly-smoke:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run live smoke tests
        env:
          PULL_SECRET: ${{ secrets.PULL_SECRET }}
        run: |
          if [ -z "$PULL_SECRET" ]; then
            echo "PULL_SECRET repository secret is not configured; skipping smoke tests"
            exit 0
          fi
          secret="$RUNNER_TEMP/pull-secret"
          printf '%s' "$PULL_SECRET" > "$secret"
          SMOKE_PULL_SECRET_PATH="$secret" go test ./pkg/image/ -run Smoke -v -timeout 60m

  nightly-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o coreshift ./cmd/coreshift

      - name: Run latest-release drift check
        env:
          PULL_SECRET: ${{ secrets.PULL_SECRET }}
        run: |
          if [ -z "$PULL_SECRET" ]; then
            echo "PULL_SECRET repository secret is not configured; skipping drift check"
            exit 0
          fi
          secret="$RUNNER_TEMP/pull-secret"
          printf '%s' "$PULL_SECRET" > "$secret"
          export XDG_STATE_HOME="$RUNNER_TEMP/drift-state"
          export XDG_CACHE_HOME="$RUNNER_TEMP/drift-cache"
          state="$XDG_STATE_HOME/coreshift/clusters/coreshift"
          api="https://127.0.0.1:16443"
          admin() {
            curl --fail --silent --show-error \
              --cacert "$state/ca.crt" \
              --cert "$state/admin.crt" \
              --key "$state/admin.key" \
              "$@"
          }
          # --version newest probes the registry's absolute newest release:
          # the unversioned default stays within the newest verified line,
          # which would stop this alarm from watching the frontier.
          boot() {
            ./coreshift run cluster --pull-secret "$secret" --version newest --port 16443 >"$1" 2>&1 &
            pid=$!
            # Up to 45 minutes: a cold cache pulls the whole payload; a
            # warm one starts in minutes.
            for _ in {1..90}; do
              grep -q "Control plane ready" "$1" && break
              kill -0 "$pid" 2>/dev/null || break
              sleep 30
            done
          }
          log="$RUNNER_TEMP/drift.log"
          boot "$log"
          labeled=""
          if grep -q "Control plane ready" "$log"; then
            admin -H 'Content-Type: application/json' \
              -d '{"apiVersion":"v1","kind":"Namespace","metadata":{"name":"drift-probe"}}' \
              "$api/api/v1/namespaces" > /dev/null
            # Up to one minute: the label syncer labels new namespaces within seconds.
            for _ in {1..12}; do
              admin "$api/api/v1/namespaces/drift-probe" \
                | grep -q 'pod-security.kubernetes.io/enforce' && labeled=1 && break
              sleep 5
            done
            # The login probe's material, the way the README's login flow
            # documents it: a user file, the secret carrying it, and the
            # OAuth object naming it. The OAuth server renders identity
            # providers at boot and never rereads them, and the control
            # plane does not restart for them, so this run arranges the
            # material and the next run's boot renders it: the restart the
            # README's flow asks for is that next run itself.
            command -v htpasswd >/dev/null || sudo apt-get install -y -qq apache2-utils
            htpasswd -c -B -b "$RUNNER_TEMP/users.htpasswd" drift-login drift-password
            admin -H 'Content-Type: application/json' \
              -d "$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"drift-htpasswd"},"type":"Opaque","data":{"htpasswd":"%s"}}' "$(base64 -w0 "$RUNNER_TEMP/users.htpasswd")")" \
              "$api/api/v1/namespaces/openshift-config/secrets" > /dev/null
            admin -X PATCH -H 'Content-Type: application/merge-patch+json' \
              -d '{"spec":{"identityProviders":[{"name":"htpasswd","type":"HTPasswd","mappingMethod":"claim","htpasswd":{"fileData":{"name":"drift-htpasswd"}}}]}}' \
              "$api/apis/config.openshift.io/v1/oauths/cluster" > /dev/null
          fi
          kill -TERM "$pid" 2>/dev/null || true
          status=0
          wait "$pid" || status=$?
          cat "$log"
          if ! grep -q "Control plane ready" "$log"; then
            echo "The latest release did not reach a ready control plane (exit $status); its stand-ins need updating before it can be supported."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "The latest release died on its own after reaching ready (exit $status); its stand-ins need updating before it can be supported."
            exit 1
          fi
          if [ "$labeled" != 1 ]; then
            echo "The latest release did not label a new namespace with its pod security enforce level; the seed layer's pod security label syncer permissions need updating."
            exit 1
          fi
          # The measured run: warm state, so its boot renders the login
          # material arranged above into the OAuth server.
          log="$RUNNER_TEMP/drift-second.log"
          boot "$log"
          logged_in=""
          served=""
          csr_issued=""
          soaked=""
          if grep -q "Control plane ready" "$log"; then
            # The login probe: the OAuth endpoint authenticates the
            # generated user and hands out a token, which names its holder
            # through the user API. Up to one minute: the OAuth server
            # settles right around the ready summary.
            redirect=""
            for _ in {1..12}; do
              redirect=$(curl --fail --silent --show-error \
                --cacert "$state/ca.crt" \
                -u drift-login:drift-password \
                -o /dev/null -w '%{redirect_url}' \
                'https://127.0.0.1:8445/oauth/authorize?client_id=openshift-challenging-client&response_type=token&redirect_uri=https%3A%2F%2F127.0.0.1%3A16443%2Foauth%2Ftoken%2Fimplicit' || true)
              [ -n "$redirect" ] && break
              sleep 5
            done
            token=$(printf '%s' "$redirect" | sed -n 's/.*#access_token=\([^&]*\).*/\1/p')
            if [ -n "$token" ]; then
              curl --fail --silent --cacert "$state/ca.crt" \
                -H "Authorization: Bearer $token" \
                "$api/apis/user.openshift.io/v1/users/~" \
                | grep -q '"name": *"drift-login"' && logged_in=1
            fi
            # The aggregated probe: one OpenShift-only group through the
            # main endpoint, the project listing, which exercises the
            # aggregated server and the front proxy.
            admin "$api/apis/project.openshift.io/v1/projects" \
              | grep -q '"kind": *"ProjectList"' && served=1
            # The join-acceptance probe: a certificate request shaped
            # the way a joining node presents one, made through the
            # admin credentials impersonating the node-bootstrapper
            # service account whose token a node's bootstrap
            # kubeconfig presents. The machine record the approver
            # matches the request against stands in for the cloud
            # machine backing the node, and its status subresource
            # takes the address as its own write; the key behind the
            # request is throwaway, because the probe exercises the
            # acceptance machinery, not a node.
            openssl req -new -newkey rsa:2048 -nodes \
              -keyout "$RUNNER_TEMP/drift-node.key" \
              -subj '/O=system:nodes/CN=system:node:drift-probe' \
              -out "$RUNNER_TEMP/drift-node.csr"
            admin -H 'Content-Type: application/json' \
              -d '{"apiVersion":"machine.openshift.io/v1beta1","kind":"Machine","metadata":{"name":"drift-probe","namespace":"openshift-machine-api"}}' \
              "$api/apis/machine.openshift.io/v1beta1/namespaces/openshift-machine-api/machines" > /dev/null
            admin -X PATCH -H 'Content-Type: application/merge-patch+json' \
              -d '{"status":{"addresses":[{"type":"InternalDNS","address":"drift-probe"}]}}' \
              "$api/apis/machine.openshift.io/v1beta1/namespaces/openshift-machine-api/machines/drift-probe/status" > /dev/null
            csr='{"apiVersion":"certificates.k8s.io/v1","kind":"CertificateSigningRequest","metadata":{"name":"drift-probe"},"spec":{"request":"'
            csr+=$(base64 -w0 "$RUNNER_TEMP/drift-node.csr")
            csr+='","signerName":"kubernetes.io/kube-apiserver-client-kubelet","usages":["digital signature","key encipherment","client auth"]}}'
            admin -H 'Content-Type: application/json' \
              -H 'Impersonate-User: system:serviceaccount:openshift-machine-config-operator:node-bootstrapper' \
              -d "$csr" \
              "$api/apis/certificates.k8s.io/v1/certificatesigningrequests" > /dev/null
            # Up to one minute: the machine approver approves and the
            # controller manager issues within seconds of the request.
            for _ in {1..12}; do
              admin "$api/apis/certificates.k8s.io/v1/certificatesigningrequests/drift-probe" \
                | grep -q '"certificate":' && csr_issued=1 && break
              sleep 5
            done
            admin -X DELETE "$api/apis/certificates.k8s.io/v1/certificatesigningrequests/drift-probe" > /dev/null
            admin -X DELETE "$api/apis/machine.openshift.io/v1beta1/namespaces/openshift-machine-api/machines/drift-probe" > /dev/null
            # Five minutes: a component can die a while after the control
            # plane is ready, past every check above.
            soaked=1
            for _ in {1..10}; do
              sleep 30
              kill -0 "$pid" 2>/dev/null || { soaked=""; break; }
              admin "$api/api/v1/namespaces/drift-probe" > /dev/null || { soaked=""; break; }
            done
          fi
          kill -TERM "$pid" 2>/dev/null || true
          status=0
          wait "$pid" || status=$?
          cat "$log"
          if ! grep -q "Control plane ready" "$log"; then
            echo "The latest release did not reach a ready control plane on its second run (exit $status); its stand-ins need updating before it can be supported."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "The latest release died on its own after reaching ready on its second run (exit $status); its stand-ins need updating before it can be supported."
            exit 1
          fi
          if [ "$logged_in" != 1 ]; then
            echo "The latest release did not log a generated user in through the OAuth server; the login chain needs updating."
            exit 1
          fi
          if [ "$served" != 1 ]; then
            echo "The latest release did not answer a project listing through the aggregated OpenShift API; the aggregated serving behind the main endpoint needs updating."
            exit 1
          fi
          if [ "$csr_issued" != 1 ]; then
            echo "The latest release did not approve and issue a joining node's certificate request; the join-acceptance layer needs updating."
            exit 1
          fi
          if [ "$soaked" != 1 ]; then
            echo "The latest release did not stay up and answering for the five minutes after ready; its stand-ins need updating before it can be supported."
            exit 1
          fi
          echo "The latest release reached ready on both runs, labeled a new namespace, logged a generated user in, answered a project listing through the aggregated OpenShift API, approved and issued a joining node's certificate request, stayed up for its five-minute soak, and shut down cleanly."

  container-smoke:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Smoke-test container mode
        env:
          PULL_SECRET: ${{ secrets.PULL_SECRET }}
        run: |
          if [ -z "$PULL_SECRET" ]; then
            echo "PULL_SECRET repository secret is not configured; skipping container smoke test"
            exit 0
          fi
          secret="$RUNNER_TEMP/pull-secret"
          printf '%s' "$PULL_SECRET" > "$secret"
          export XDG_STATE_HOME="$RUNNER_TEMP/container-state"
          export XDG_CACHE_HOME="$RUNNER_TEMP/container-cache"
          ./coreshift create cluster --pull-secret "$secret" --version 4.22.19
          state="$XDG_STATE_HOME/coreshift/clusters/coreshift"
          curl --fail --silent --show-error \
            --cacert "$state/ca.crt" \
            --cert "$state/admin.crt" \
            --key "$state/admin.key" \
            https://127.0.0.1:6443/api/v1/namespaces > /dev/null
          ready=$(./coreshift get clusters | awk '$1 == "coreshift" { print $4 }')
          test "$ready" = ready
          ./coreshift delete cluster
          test ! -d "$state"
